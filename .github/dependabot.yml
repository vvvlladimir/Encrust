version: 2

# Weekly, and grouped as hard as the risk allows: a separate pull request per bump is a queue
# nobody reads, and an update nobody reads is an update nobody checked. What actually matters — a
# published advisory, or a yanked crate — is watched by the audit workflow, not by this file.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Two pull requests at most: everything compatible in one, every major in another. A major is
    # still read line by line — egui, wgpu and the crates that decode somebody else's file break
    # quietly — but it is read in one sitting rather than in six notifications.
    open-pull-requests-limit: 2
    groups:
      cargo-compatible:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
    commit-message:
      prefix: build
      include: scope

  # Actions are small and are read together — majors included, since a workflow either still runs
  # or does not. One pull request for the lot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The fuzz crate is deliberately outside the workspace, so its lockfile is its own. Only its own
  # dependency is bumped here: the rest comes from the workspace, whose Cargo.toml a bump from this
  # directory would edit without touching the root Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: libfuzzer-sys
    commit-message:
      prefix: build
      include: scope
