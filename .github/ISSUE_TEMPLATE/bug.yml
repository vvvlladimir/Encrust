name: Bug
description: Something does not work, crashes, or produces a wrong file.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: >
        The CLI command, or the clicks in order. If a particular model triggers it, attach it only
        if it is yours to share — otherwise describe it, or make a small shape that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, or `git rev-parse --short HEAD` for a build from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Browser]
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer and profile
      description: Leave empty if it is not printer-specific.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Output
      description: >
        Run with `RUST_LOG=debug` and paste what it printed, or the panic message and backtrace.
      render: text
    validations:
      required: false
