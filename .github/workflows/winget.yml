name: winget

# Opens a pull request to microsoft/winget-pkgs with a published release's installers; the manual
# trigger resends a tag. Komac builds on the last merged manifest, see ADR 0455.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to send to winget, for example v0.9.0.
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE: Encrust.Encrust
  KOMAC: "2.17.2"
  KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      # Pinned by version and hash: this binary holds the token.
      - name: Install komac
        run: |
          base="https://github.com/russellbanks/Komac/releases/download/v$KOMAC"
          archive="komac-$KOMAC-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          echo "$KOMAC_SHA256  $archive" | sha256sum -c -
          mkdir komac
          tar -xzf "$archive" -C komac
          echo "$RUNNER_TEMP/komac" >> "$GITHUB_PATH"

      # Only the installers the release carries: a release built before ADR 0454 has no ARM64 one.
      - name: Submit the release's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          test -n "$WINGET_TOKEN" || {
            echo "the WINGET_TOKEN secret is not set" >&2
            exit 1
          }
          mapfile -t urls < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name | test("^Encrust-windows-.*-setup\\.exe$")) | .url')
          test "${#urls[@]}" -gt 0 || {
            echo "release $TAG has no Windows installer" >&2
            exit 1
          }
          komac update "$PACKAGE" --version "${TAG#v}" --urls "${urls[@]}" \
            --token "$WINGET_TOKEN" --submit
