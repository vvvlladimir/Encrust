name: CI

# Everything that must hold before a change reaches main: the three checks from AGENTS.md, the
# rustdoc rules and the rust-version floor. Linux runs on a pull request and on main, skipped for a
# tree that already passed; macOS, Windows, the threaded web build and the floor run nightly when
# main moved, or on demand before a merge. See ADR-0273.

on:
  # What nothing here builds or reads; the nightly gate below filters the same list.
  push:
    branches: [main]
    paths-ignore: &unbuilt
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  # `ready_for_review` is on top of the default three: a draft runs nothing, so the run happens
  # when the pull request is declared finished rather than on every commit leading up to it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *unbuilt
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless; the nightly run on main
# is in its own group so that a push does not cancel it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # wgpu, naga and egui make `target/` tens of gigabytes once debug info is in it, which is how the
  # ubuntu leg of this workflow used to die without even leaving a log. Nothing here runs a
  # debugger, so the symbols are pure disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # A squash merge of an up-to-date pull request lands the tree its run already passed, and a night
  # with no push to main has nothing new to check. See ADR-0273.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.tree.outputs.skip == 'true' || steps.nightly.outputs.skip == 'true' }}
    steps:
      # A run passing is not enough: a draft's run passes with every job skipped.
      - id: tree
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree_of() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          tree=$(tree_of "$GITHUB_SHA")
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --status success --limit 30 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"' |
          while read -r id sha; do
            [ "$(tree_of "$sha")" = "$tree" ] || continue
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "rust (ubuntu)") | .conclusion' | grep -qx success || continue
            echo "run $id passed this tree"
            echo skip=true >> "$GITHUB_OUTPUT"
            break
          done

      - id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The compare API lists at most 300 files, so a list that long counts as a change.
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          [ -n "$last" ] || exit 0
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA" --jq '.files[].filename')
          [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ] || exit 0
          built=$(printf '%s\n' "$files" |
            grep -vE '^(docs/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$|^\.github/FUNDING\.yml$' || true)
          if [ -z "$built" ]; then echo skip=true >> "$GITHUB_OUTPUT"; fi

  # Dependabot edits only Cargo.lock; the two files generated from it are regenerated here, and
  # pushed by `sync-push` so CI runs once, on the commit that has them. See ADR-0381.
  sync-generate:
    name: dependabot sync
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/cargo/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari,cargo-about@0.9.3

      - run: |
          cargo hakari generate
          # The hack's new edges are recorded in Cargo.lock; resolving again moves no version.
          cargo metadata --format-version 1 > /dev/null
          cargo run -q -p xtask --locked -- licenses

      - id: diff
        run: git diff --quiet -- Cargo.lock workspace-hack/Cargo.toml THIRD-PARTY-LICENSES.md || echo changed=true >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-sync
          path: |
            Cargo.lock
            workspace-hack/Cargo.toml
            THIRD-PARTY-LICENSES.md

  # The App's token exists only in this job, which runs nothing from the bumped crates.
  sync-push:
    name: dependabot push
    needs: sync-generate
    if: needs.sync-generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          name: dependabot-sync

      # A push by the App's token, unlike GITHUB_TOKEN's, starts the next run.
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          id=$(gh api "/users/$BOT" --jq .id)
          git config user.name "$BOT"
          git config user.email "$id+$BOT@users.noreply.github.com"
          git commit -am "build(deps): regenerate workspace-hack and third-party licences"
          git push

  linux:
    name: rust (ubuntu)
    needs: [gate, sync-generate]
    # Skipped when dependabot sync changed something: its push starts the run that matters.
    if: >-
      !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true'
      && needs.sync-generate.outputs.changed != 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-gui-deps

      # rustup reads rust-toolchain.toml and installs that channel with its components; no action
      # is needed, and none may override it, or CI would test a compiler nobody develops against.
      - name: Install the pinned toolchain
        run: rustup show

      # Shared with the licence check in audit.yml. Only main saves: a pull request's cache is
      # visible to that pull request alone and only pushes main's out of the 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The dependency graph docs/architecture.md draws, against what the manifests declare.
      - name: Architecture
        run: cargo run -q -p xtask --locked -- arch

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      # Every crate builds a dependency at the one feature set workspace-hack holds (ADR 0272).
      - name: Workspace hack
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

      # There is no GPU on a runner, so nothing here opens a window: these are the cores' tests,
      # and the app is only compiled, by the clippy step above.
      - name: Test
        run: cargo test --workspace --locked

      # Everything but the command line and the profile tool builds for a browser, the window
      # too: it comes in under `encrust-web`, its binary being the desk's (ADR 0181). Compiling is
      # not running: a call that only fails there is kept out by ADR 0177.
      - name: Browser build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --locked --target wasm32-unknown-unknown \
            --exclude encrust-app --exclude encrust-cli --exclude xtask

      # Every public item of a library crate carries rustdoc, by the rule in code-style.md. A broken
      # intra-doc link is the usual way that stops being true.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  platforms:
    name: rust (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The window as a browser runs it, on threads: a nightly compiler rebuilding the standard
  # library, so it runs nightly like the other platforms. See ADR 0181.
  web:
    name: web (threads)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly with the standard library's source
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo xtask web --check

  # One source of truth: the toolchain checked here is the one Cargo.toml claims as its floor.
  msrv:
    name: msrv
    needs: gate
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-gui-deps

      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-toolchain.toml pins stable, and only this variable outranks it.
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  # A secret can land in any file, so this is here rather than in audit.yml, whose triggers are
  # filtered to the lockfile. What may be ignored is in .gitleaks.toml. Free for public
  # repositories and personal accounts; an organisation would need GITLEAKS_LICENSE.
  secrets:
    name: secret scan
    if: github.event.pull_request.draft != true && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The action lists a pull request's commits to scan only those.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because a secret removed in a later commit is still in an earlier one.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
