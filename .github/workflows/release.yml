name: Release

# Builds the archives for a tag and hangs them on the draft release release-please already made.
# Nothing reaches a user until a maintainer publishes that draft by hand: with four of five printer
# profiles unverified, a bad release costs more than a late one.
#
# Called by `release-please.yml` once it has tagged the release, never by the tag itself: a tag
# pushed with GITHUB_TOKEN raises no event, so `on: push: tags` would simply never fire. The manual
# trigger is for rebuilding a tag whose run failed.
#
# Each platform gets an installer people download and an archive the window's own update reads:
# `.dmg`, `-setup.exe`, `.AppImage` and `.deb` from `cargo packager`, configured in
# crates/encrust-app/Cargo.toml. Nothing is code-signed; each archive is signed with the project's
# release key, and `latest.json` names them for the window's update check. Publishing the draft is
# what makes that feed visible. See ADR-0160, ADR-0162 and ADR-0172.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build, for example v0.1.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job owns the draft, so the four build legs never race over it. It also refuses a tag naming
  # a version the binaries do not carry: `--version` would then disagree with the page the user
  # downloaded from.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Tag matches the workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$crate" = "${TAG#v}" || {
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          }

      # release-please opens the draft and writes its notes; this only covers the manual trigger on
      # a tag that has none, and must never overwrite a body that already exists.
      - name: Make sure a draft exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: encrust-macos-aarch64.tar.gz
            formats: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: encrust-macos-x86_64.tar.gz
            formats: dmg
          # The oldest supported runner: a Linux binary cannot run against a glibc older than the
          # one it was built on, and a newer runner would raise that floor for no gain.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: encrust-linux-x86_64.tar.gz
            formats: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: encrust-windows-x86_64.zip
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Linux windowing headers
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/linux-gui-deps

      # rust-toolchain.toml decides the version; the target is what this matrix entry adds.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p encrust-app -p encrust-cli

      # The profiles are compiled into printer-profiles, so the archive needs no asset directory.
      # The licences it does need: handing somebody the binary is what obliges us to pass on both
      # ours and those of the libraries compiled into it (ADR 0214).
      - name: Collect the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          # `Encrust/`, not `encrust/`: a window from before ADR 0176 must not find the CLI there.
          out=staging/Encrust
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "Windows" ]; then ext=.exe; else ext=""; fi
          cp "target/$TARGET/release/encrust-gui$ext" "$out/"
          cp "target/$TARGET/release/encrust$ext" "$out/"
          cp LICENSE THIRD-PARTY-LICENSES.md README.md "$out/"
          case "$ARCHIVE" in
            *.zip) (cd staging && 7z a "../$ARCHIVE" Encrust) ;;
            *) tar -czf "$ARCHIVE" -C staging Encrust ;;
          esac

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # linuxdeploy is itself an AppImage, and a runner has no FUSE to mount it with.
      - name: Package the installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: >
          cargo packager --release --target ${{ matrix.target }} -p encrust-app
          -f ${{ matrix.formats }} -o "$GITHUB_WORKSPACE/packages"

      # Names without the version, so `releases/latest/download/<name>` always works.
      - name: Attach them to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir installers
          for path in packages/*; do
            case "$path" in
              *.dmg) name="Encrust-macos-${TARGET%%-*}.dmg" ;;
              *-setup.exe) name=Encrust-windows-x86_64-setup.exe ;;
              *.AppImage) name=Encrust-linux-x86_64.AppImage ;;
              *.deb) name=encrust_amd64.deb ;;
              *) continue ;;
            esac
            cp "$path" "installers/$name"
          done
          ls installers
          gh release upload "$TAG" "$ARCHIVE" installers/* --clobber --repo "$GITHUB_REPOSITORY"

  # The window built for a browser, as one archive the site unpacks under /app/run/ (encrust-site,
  # scripts/web-app.mjs). The site takes it from the latest published release, so it ships when the
  # desktop builds do. It is not in the update feed: a browser updates through its service worker.
  # The nightly is pinned so that the same tag builds the same module twice. See
  # docs/design/web-build.md.
  web:
    needs: draft
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: nightly-2026-10-01
      BINARYEN: version_133
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install the nightly with the standard library's source
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain "$TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-release

      # wasm-bindgen-cli must be the exact version of the crate, which the lock names.
      - name: Install wasm-bindgen and wasm-opt
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo xtask web --toolchain "$TOOLCHAIN"

      # Cloudflare serves no single file over 25 MiB, so a module past that could never go live.
      - name: Pack and attach to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          size=$(stat -c %s target/web/dist/encrust_web_bg.wasm)
          test "$size" -le 26214400 || {
            echo "encrust_web_bg.wasm is $size bytes, over Cloudflare's 25 MiB per file" >&2
            exit 1
          }
          tar -czf encrust-web.tar.gz -C target/web/dist .
          sha256sum encrust-web.tar.gz | cut -d' ' -f1 > encrust-web.tar.gz.sha256
          gh release upload "$TAG" encrust-web.tar.gz encrust-web.tar.gz.sha256 --clobber \
            --repo "$GITHUB_REPOSITORY"

  # One job holds the signing key, after every leg has uploaded, so the feed names every archive.
  # The trusted comment binds a signature to its version and file name, which the window checks;
  # a signature cannot then be moved to another archive or replayed for an older release.
  feed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign the archives and write the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || {
            echo "the UPDATE_SIGNING_KEY secret is not set" >&2
            exit 1
          }
          version="${TAG#v}"
          # The window accepts an archive only under the repository its Cargo.toml names.
          repository=$(grep -m1 '^repository = ' Cargo.toml | cut -d'"' -f2)
          key="$RUNNER_TEMP/release.key"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")

          mkdir dist
          gh release download "$TAG" --pattern 'encrust-*' --dir dist --repo "$GITHUB_REPOSITORY"
          rm -f dist/*.minisig
          platforms='{}'
          for path in dist/encrust-*.tar.gz dist/encrust-*.zip; do
            [ -e "$path" ] || continue
            archive=$(basename "$path")
            # The browser build is no platform the window could update to.
            [ "$archive" = encrust-web.tar.gz ] && continue
            minisign -S -s "$key" -m "$path" -t "encrust $version $archive"
            # Against the key compiled into the window, so a secret that drifted from it fails here
            # rather than in every user's update.
            minisign -V -p assets/update-key.pub -m "$path"
            platform="${archive#encrust-}"
            platform="${platform%.tar.gz}"
            platform="${platform%.zip}"
            platforms=$(jq --arg platform "$platform" \
              --arg url "$repository/releases/download/$TAG/$archive" \
              --rawfile signature "$path.minisig" \
              '.[$platform] = {url: $url, signature: $signature}' <<<"$platforms")
          done
          rm -f "$key"

          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > notes.md
          jq -n --arg version "$version" --rawfile notes notes.md --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, platforms: $platforms}' > dist/latest.json
          gh release upload "$TAG" dist/*.minisig dist/latest.json --clobber \
            --repo "$GITHUB_REPOSITORY"
