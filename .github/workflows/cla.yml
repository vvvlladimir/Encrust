name: CLA

# Every external pull request must be covered by .github/CLA.md before it can be merged.
# Signatures are stored as a JSON file on the `cla-signatures` branch of this repository, so the
# record lives with the code and survives a move of the CI provider.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the contributor's signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned by digest, not by tag: this step runs on `pull_request_target` with
        # `contents: write`, so a moved tag would be a write token handed to new code.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # No `PERSONAL_ACCESS_TOKEN`: that one is for signatures kept in another repository.
          # These are kept here, which `contents: write` above already covers.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/vvvlladimir/Encrust/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: vvvlladimir,dependabot[bot]
