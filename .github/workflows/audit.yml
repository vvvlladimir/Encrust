name: Audit

# What the dependency tree drags in: known vulnerabilities, licences AGPL cannot take, and crates
# from anywhere but crates.io, and whether the file stating those licences to a user is still the
# one the lockfile describes. On a schedule as well as on a change, because an advisory is
# published against code that has been sitting still. The rules are in deny.toml and about.toml.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - about.toml
      - about.hbs
      - THIRD-PARTY-LICENSES.md
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - about.toml
      - about.hbs
      - THIRD-PARTY-LICENSES.md
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# The same as ci.yml's, which rust-cache hashes into the key the notices job shares with it.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # THIRD-PARTY-LICENSES.md ships in every archive and installer, so a dependency added without
  # regenerating it would hand a user terms that no longer match the binary. See ADR 0214.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      # Linux CI's cache already holds xtask, so this only reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false

      # Each release words some licences differently; the pin moves with licenses.rs's INSTALL.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - run: cargo run -q -p xtask --locked -- licenses --check
