# The connector spike's engine (ai-integration.md, step 18): a throwaway, outside the workspace.
[package]
name = "connector-engine"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core-engine = { path = "../../../crates/core-engine" }
core-geometry = { path = "../../../crates/core-geometry" }
core-mesh-io = { path = "../../../crates/core-mesh-io" }
core-plate = { path = "../../../crates/core-plate" }
printer-profiles = { path = "../../../crates/printer-profiles" }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[workspace]

[profile.release]
opt-level = 3
debug = false
