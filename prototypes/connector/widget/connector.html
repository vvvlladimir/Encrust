<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 12px; }
  li.ok::marker { content: "✓ "; } li.no::marker { content: "✗ "; }
</style>
<p id="state">Waiting for the model…</p>
<ol id="answers"></ol>
<p><a id="download" hidden>Download the report</a></p>
<script type="module">
// The connector spike's page: answers the four questions of ai-integration.md step 18 and
// says each answer on the page and to the server's log. Throwaway code.
const openai = window.openai ?? {};
const answers = document.getElementById("answers");
const state = document.getElementById("state");
let logUrl = null;

function answer(question, ok, detail) {
  const item = document.createElement("li");
  item.className = ok ? "ok" : "no";
  item.textContent = `${question}: ${detail}`;
  answers.append(item);
  if (logUrl) {
    fetch(logUrl, { method: "POST", body: JSON.stringify({ question, ok, detail }) }).catch(() => {});
  }
}

async function output() {
  if (openai.toolOutput) return openai.toolOutput;
  await new Promise((ready) => window.addEventListener("openai:set_globals", ready, { once: true }));
  return window.openai.toolOutput;
}

const given = await output();
logUrl = new URL("/log", given.engine).href;
answer("host", true, `window.openai offers ${Object.keys(openai).sort().join(", ")}`);

let model = null;
try {
  const started = performance.now();
  const fetched = await fetch(given.download_url);
  model = new Uint8Array(await fetched.arrayBuffer());
  const seconds = ((performance.now() - started) / 1000).toFixed(1);
  answer("1. file in", fetched.ok, `HTTP ${fetched.status}, ${model.length} bytes in ${seconds} s`);
} catch (error) {
  answer("1. file in", false, `fetching download_url failed: ${error}`);
}

let report = null;
if (model) {
  try {
    state.textContent = "Preparing in this browser…";
    const engine = await import(given.engine);
    await engine.default();
    const [printer, resin] = await Promise.all(
      [given.printer_toml, given.resin_toml].map(async (url) => (await fetch(url)).text()),
    );
    const started = performance.now();
    report = JSON.parse(engine.prepare(model, printer, resin));
    const seconds = (performance.now() - started) / 1000;
    report.seconds = Number(seconds.toFixed(1));
    report.isolated = self.crossOriginIsolated;
    answer("2. prepare", seconds < 60, `${report.seconds} s, isolated ${report.isolated}`);
  } catch (error) {
    answer("2. prepare", false, String(error));
  }
}

if (report) {
  state.textContent = "Prepared; telling the model.";
  try {
    if (openai.callTool) {
      await openai.callTool("report_preparation", { report });
      answer("3. report", true, "callTool(report_preparation) answered; see whether the model read it");
    }
    if (openai.sendFollowUpMessage) {
      await openai.sendFollowUpMessage({
        prompt: `The page prepared the model: ${JSON.stringify(report)}. Tell me what it found.`,
      });
      answer("3. report", true, "sendFollowUpMessage sent; see whether it shows and is answered");
    }
    if (!openai.callTool && !openai.sendFollowUpMessage) {
      answer("3. report", false, "the host offers neither callTool nor sendFollowUpMessage");
    }
  } catch (error) {
    answer("3. report", false, String(error));
  }

  const file = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
  const link = document.getElementById("download");
  link.href = URL.createObjectURL(file);
  link.download = "encrust-report.json";
  link.hidden = false;
  link.addEventListener("click", () => answer("4. file out", true, "the link was clicked; did a file arrive?"));
  if (openai.downloadFile) answer("4. file out", true, "the host offers downloadFile too");
}
</script>
