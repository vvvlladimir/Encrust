<!doctype html>
<meta charset="utf-8">
<title>Connector spike</title>
<pre id="out">running…</pre>
<script type="module">
// Fetches the model, printer and resin named in the query, prepares the model with the
// spike's engine on this page's one thread, and leaves the result for the runner to read.
import init, { prepare, memoryBytes } from "./pkg/connector_engine.js";
const query = new URLSearchParams(location.search);
const out = document.getElementById("out");
const bytes = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer());
const text = async (url) => (await fetch(url)).text();
try {
  const loading = performance.now();
  await init();
  const loaded_s = (performance.now() - loading) / 1000;
  const [model, printer, resin] = await Promise.all([
    bytes(query.get("model")), text("printer.toml"), text("resin.toml"),
  ]);
  const started = performance.now();
  const report = JSON.parse(prepare(model, printer, resin));
  const seconds = (performance.now() - started) / 1000;
  window.result = {
    isolated: self.crossOriginIsolated,
    module_load_s: Number(loaded_s.toFixed(2)),
    prepare_s: Number(seconds.toFixed(1)),
    peak_wasm_mb: Math.round(memoryBytes() / 1e6),
    report,
  };
} catch (error) {
  window.result = { error: String(error) };
}
out.textContent = JSON.stringify(window.result, null, 2);
</script>
