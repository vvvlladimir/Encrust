# Supports sized by what each one holds: a light one where little hangs, a heavy one under
# a large island or under much of the model. See ADR 0325.

name = "Auto"

# The support profiles a support is built to, by catalogue id, lightest first.
shapes = ["auto-light", "auto-medium", "auto-heavy"]

# Where supports go, as a support profile says it; the shapes' own numbers are not read.
density = 1.0
max_overhang_deg = 40.0
contact_spacing_mm = 1.8
steep_contact_spacing_mm = 3.3

# The least island, mm² on the layer it begins on, held by the second shape and by the
# third.
island_area_mm2 = [2.4, 3.2]

# The least model standing above an overhang, mm³, held by the second shape and by the
# third.
overhang_volume_mm3 = [1000.0, 2000.0]

# The least resin a step puts out in its one layer, mm³, to be held as a step at all, then
# by the second shape and by the third. A smaller one is held as an overhang.
step_volume_mm3 = [0.1, 7.0, 12.0]

# How far above a step of each size the faces near it are held as part of it, mm.
step_height_mm = [1.5, 2.4, 3.2]

# How far from vertical a face near a step may lean before it is held, degrees.
step_lean_deg = 20.0
