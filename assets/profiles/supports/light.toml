# Thin supports for small, well-anchored parts. Easy to cut off, easy to snap.
#
# Sized to what an ELEGOO Saturn 4 Ultra is run with in the field, bar the density, the
# overhang angle and the foot shape, which are ours; where the numbers come from: ADR 0131.

name = "Light"

facets = 12

# How many supports automatic placement puts down against what it reckons is enough,
# counted over an area: doubling it puts down twice as many.
density = 0.6

# How far the lowest point of a part should stand clear of the plate.
z_lift_mm = 2.0

# How much clear air a support's body keeps between itself and the model.
clearance_mm = 0.6

# How far a surface may lean before it needs holding up, degrees from vertical.
max_overhang_deg = 55.0

# How far apart automatic placement puts contacts over an overhang, before the
# density scales it.
contact_spacing_mm = 4.0

[tip]
# cone, sphere or plane.
shape = "cone"
contact_diameter_mm = 0.5
contact_depth_mm = 0.3

[top]
upper_diameter_mm = 0.5
lower_diameter_mm = 0.9
length_mm = 2.0

[middle]
diameter_mm = 0.9

[bottom]
# cylinder, cone, prism or cube.
shape = "cylinder"
platform_diameter_mm = 7.0
platform_thickness_mm = 0.8

# The flare between the pillar and the pad. It rises as far as it widens, so these
# two also set its height.
upper_diameter_mm = 0.9
lower_diameter_mm = 2.2

# The thin strut used where a support runs from one part of the model to another rather
# than down to the plate. Both of its ends sink into a surface.
[small_pillar]
enabled = true
diameter_mm = 0.3
upper_depth_mm = 0.15
lower_depth_mm = 0.2

# How the tips of nearby supports merge into shared trunks on the way down.
[branching]
enabled = true
max_angle_deg = 50.0
max_merge_distance_mm = 14.0
trunk_exponent = 2.5
max_trunk_diameter_mm = 1.0

# The slab the supports stand on instead of standing on the plate.
[raft]
enabled = false
# hull or rectangle.
shape = "hull"
area_ratio = 1.1
thickness_mm = 0.5
slope_deg = 30.0

# Struts tying tall trunks to each other, so that neither can sway on the peel.
[bracing]
enabled = true
diameter_mm = 0.8
max_spacing_mm = 8.0
start_height_mm = 8.0
rise_mm = 8.0
