# An ABS-like tough resin: more viscous than a standard one, so it is lifted slower and
# given a longer light-off delay for the film to fall back.
#
# UNVERIFIED: exposure depends on the bottle, the printer's LED and the room temperature.
# Print an exposure test before trusting these numbers.

name = "ABS-like tough"
layer_height_mm = 0.05
exposure_s = 3.0
bottom_exposure_s = 40.0
bottom_layers = 8
transition_layers = 10
light_off_delay_s = 1.0

lift_distance_mm = 7.0
lift_speed_mm_min = 50.0
retract_distance_mm = 7.0
retract_speed_mm_min = 130.0

bottom_lift_distance_mm = 9.0
bottom_lift_speed_mm_min = 45.0
bottom_retract_speed_mm_min = 130.0

light_pwm = 255
bottom_light_pwm = 255
density_g_cm3 = 1.12

# The wait is spent resting after the plate is back down, where the film has settled,
# rather than as a light-off delay the peel already consumes.
[waits]
mode = "rest"
after_retract_s = 1.0

[printers.elegoo-mars-4-ultra]
exposure_s = 2.9
bottom_exposure_s = 38.0

[printers.elegoo-saturn-4-ultra]
exposure_s = 2.7
bottom_exposure_s = 36.0
lift_distance_mm = 5.0
lift_speed_mm_min = 90.0
retract_distance_mm = 5.0
retract_speed_mm_min = 180.0

[printers.elegoo-mars-3-pro]
exposure_s = 3.6
bottom_exposure_s = 45.0

[printers.phrozen-sonic-mini-8k]
exposure_s = 3.2
bottom_exposure_s = 42.0

[printers.uniformation-gktwo]
exposure_s = 2.8
bottom_exposure_s = 36.0
light_off_delay_s = 0.6

[printers.uniformation-gktwo.waits]
mode = "rest"
after_retract_s = 0.6
