# Anycubic Photon M3 Premium.

name = "Photon M3 Premium"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon M3 Premium"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 7680
height_px = 4320
width_mm = 218.88
height_mm = 123.12

[build_volume]
x = 218.88
y = 123.12
z = 250.0

[output.anycubic]
extension = "pm3r"
