# QIDI Shadow6.0 Pro.
#
# The source profile asks for a `.ctb` below version 4 and we write
# version 4, so this machine needs firmware from 2021 or later. An older
# board refuses the file rather than misprinting it.

name = "Shadow6.0 Pro"
manufacturer = "QIDI"
machine_name = "QIDI Shadow6.0 Pro"
mirror_x = true
mirror_y = false
output = "ctb4"
connection = "none"

[display]
width_px = 1440
height_px = 2560
width_mm = 74.52
height_mm = 132.48
grey_floor = 0

[build_volume]
x = 74.52
y = 132.48
z = 150.0

[firmware]
per_layer_settings = false
variable_layer_height = false

[locked]
transition_layers = 0
light_pwm = 255
bottom_light_pwm = 255
