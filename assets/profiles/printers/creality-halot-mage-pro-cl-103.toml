# Creality Halot Mage Pro CL-103.

name = "Halot Mage Pro CL-103"
manufacturer = "Creality"
mirror_x = true
mirror_y = false
output = "cxdlp4"
connection = "none"

[display]
width_px = 7680
height_px = 4320
width_mm = 228.096
height_mm = 128.304
grey_floor = 0

[build_volume]
x = 228.096
y = 128.304
z = 230.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
retract_speed_mm_min = 60.0
bottom_lift_distance_mm = 6.0
bottom_lift_speed_mm_min = 60.0
bottom_retract_speed_mm_min = 60.0
wait_mode = "light-off"
bottom_light_off_delay_s = 0.0

[limits]
layer_height_mm = { min = 0.01, max = 0.2 }
exposure_s = { min = 0.5, max = 10 }
bottom_exposure_s = { min = 10, max = 70 }
bottom_layers = { max = 10 }
light_off_delay_s = { max = 10 }
lift_distance_mm = { min = 8, max = 20 }
lift_speed_mm_min = { min = 60 }

# Read off the vendor's own slicer profile for this machine; see ADR 0371.
[buffer]
enabled = true
height_mm = 10.0
speed_mm_min = 600.0
light_off_delay_s = 6.0
