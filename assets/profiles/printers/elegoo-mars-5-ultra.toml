# Elegoo Mars 5 Ultra.

name = "Mars 5 Ultra"
manufacturer = "Elegoo"
# Verified against a file this machine prints.
machine_name = "ELEGOO Mars 5 Ultra"
mirror = "lcd-mirror"
output = "goo"
# Elegoo Link: this generation answers an SDCP broadcast.
connection = "sdcp"

[display]
width_px = 8520
height_px = 4320
width_mm = 153.36
height_mm = 77.76

[build_volume]
x = 153.36
y = 77.76
z = 165.0

[firmware]
# A tilting vat, which reads the header alone, see ADR 0142.
per_layer_settings = false

# The vat tilts to separate a layer, so the peel is the firmware's defaults, and
# it waits by resting only; see ADR 0301.
[locked]
lift_distance_mm = 0.05
lift_speed_mm_min = 0.05
retract_distance_mm = 0.05
retract_speed_mm_min = 0.05
bottom_lift_distance_mm = 0.05
bottom_lift_speed_mm_min = 0.05
bottom_retract_speed_mm_min = 0.05
wait_mode = "rest"

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
