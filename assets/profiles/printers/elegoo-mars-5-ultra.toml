# Elegoo Mars 5 Ultra.
#
# UNVERIFIED: the panel and the machine name are read off a file the vendor's own slicer
# wrote for this machine, not measured. Check them against the actual machine before
# trusting a print, especially the illuminated area and the mirroring flags.

name = "Mars 5 Ultra"
manufacturer = "Elegoo"
# Verified against a file the vendor's own slicer wrote for this machine.
machine_name = "ELEGOO Mars 5 Ultra"
mirror_x = true
mirror_y = false
output = "goo"
# Elegoo Link: this generation answers an SDCP broadcast.
connection = "sdcp"

[display]
width_px = 8520
height_px = 4320
width_mm = 153.36
height_mm = 77.76

[build_volume]
x = 153.36
y = 77.76
z = 165.0

[firmware]
# A tilting vat, which the vendor's files leave reading the header alone, see ADR 0142.
per_layer_settings = false

# The vat tilts to separate a layer, so the peel is the vendor slicer's hidden defaults, and
# it waits by resting only; see ADR 0301.
[locked]
lift_distance_mm = 0.05
lift_speed_mm_min = 0.05
retract_distance_mm = 0.05
retract_speed_mm_min = 0.05
bottom_lift_distance_mm = 0.05
bottom_lift_speed_mm_min = 0.05
bottom_retract_speed_mm_min = 0.05
wait_mode = "rest"
