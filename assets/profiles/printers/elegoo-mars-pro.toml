# Elegoo Mars Pro.

name = "Mars Pro"
manufacturer = "Elegoo"
machine_name = "ELEGOO Mars Pro"
mirror_x = true
mirror_y = false
# The vendor's profile names `.ctb` without its revision; version 4 is the oldest we write.
output = "ctb4"
connection = "none"

[display]
width_px = 1440
height_px = 2560
width_mm = 68.04
height_mm = 120.96
grey_floor = 0

[build_volume]
x = 68.04
y = 120.96
z = 150.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
bottom_light_pwm = 255
light_pwm = 255
