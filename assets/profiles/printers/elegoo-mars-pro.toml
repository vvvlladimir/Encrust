# Elegoo Mars Pro.

name = "Mars Pro"
manufacturer = "Elegoo"
machine_name = "ELEGOO Mars Pro"
mirror = "lcd-mirror"
front_edge = "max_x"
output = "ctb5"
connection = "none"

[display]
width_px = 1440
height_px = 2560
width_mm = 68.04
height_mm = 120.96

[build_volume]
x = 68.04
y = 120.96
z = 150.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
bottom_light_pwm = 255
light_pwm = 255

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }

# The machine's stock settings; see ADR 0371.
[plate_inset]
min_x_mm = 0.26
max_x_mm = 1.3
min_y_mm = 2.5
max_y_mm = 1.15
