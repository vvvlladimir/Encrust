# Creality Halot One Plus CL-79.

name = "Halot One Plus CL-79"
manufacturer = "Creality"
mirror_x = false
mirror_y = false
output = "cxdlp3"
connection = "none"

[display]
width_px = 4320
height_px = 2560
width_mm = 172.8
height_mm = 102.4
grey_floor = 0

[build_volume]
x = 172.8
y = 102.4
z = 160.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
wait_mode = "light-off"
