lift_distance_mm = { warn_min = 5, warn_max = 10 }
lift_speed_mm_min = { warn_min = 60, warn_max = 180 }
retract_speed_mm_min = { warn_min = 60, warn_max = 180 }
bottom_lift_distance_mm = { warn_min = 5, warn_max = 10 }
bottom_lift_speed_mm_min = { warn_min = 60, warn_max = 180 }
bottom_retract_speed_mm_min = { warn_min = 60, warn_max = 180 }
