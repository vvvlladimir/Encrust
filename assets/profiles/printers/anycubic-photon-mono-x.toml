# Anycubic Photon Mono X.

name = "Photon Mono X"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono X"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 3840
height_px = 2400
width_mm = 192.0
height_mm = 120.0

[build_volume]
x = 192.0
y = 120.0
z = 245.0

[output.anycubic]
extension = "pwmx"
revision = "v516"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
