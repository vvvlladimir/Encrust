# Anycubic Photon M3 Plus.

name = "Photon M3 Plus"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon M3 Plus"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 5760
height_px = 3600
width_mm = 197.0
height_mm = 122.8

[build_volume]
x = 197.0
y = 122.8
z = 245.0

[output.anycubic]
extension = "pwmb"
revision = "v517"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 2.0

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
