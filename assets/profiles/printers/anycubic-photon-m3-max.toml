# Anycubic Photon M3 Max.

name = "Photon M3 Max"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon M3 Max"
mirror = "lcd-mirror"
connection = "none"

[display]
width_px = 6480
height_px = 3600
width_mm = 298.08
height_mm = 165.6

[build_volume]
x = 298.08
y = 165.6
z = 300.0

[output.anycubic]
extension = "pm3m"
revision = "v516"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 2.0

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
