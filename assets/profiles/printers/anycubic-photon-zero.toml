# Anycubic Photon Zero.

name = "Photon Zero"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Zero"
mirror_x = true
mirror_y = false
front_edge = "min_x"
connection = "none"

[display]
width_px = 480
height_px = 854
width_mm = 55.44
height_mm = 98.64
grey_floor = 0

[build_volume]
x = 55.44
y = 98.64
z = 150.0

[output.anycubic]
extension = "pw0"
revision = "v1"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
light_pwm = 255
bottom_light_pwm = 255
wait_mode = "light-off"
bottom_light_off_delay_s = 1.0

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
lift_distance_mm = { warn_max = 50 }
lift_speed_mm_min = { warn_min = 6, warn_max = 1200 }
retract_speed_mm_min = { warn_min = 6, warn_max = 1200 }
bottom_lift_distance_mm = { warn_max = 50 }
bottom_lift_speed_mm_min = { warn_min = 6, warn_max = 1200 }
bottom_retract_speed_mm_min = { warn_min = 6, warn_max = 1200 }
