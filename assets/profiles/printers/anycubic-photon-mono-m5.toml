# Anycubic Photon Mono M5.

name = "Photon Mono M5"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono M5"
mirror = "lcd-mirror"
connection = "none"

[display]
width_px = 11520
height_px = 5120
width_mm = 218.88
height_mm = 122.88
grey_min = 63

[build_volume]
x = 218.88
y = 122.88
z = 200.0

[output.anycubic]
extension = "pm5"
revision = "v517"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
