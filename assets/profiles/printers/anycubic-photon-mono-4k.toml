# Anycubic Photon Mono 4K.

name = "Photon Mono 4K"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono 4K"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 3840
height_px = 2400
width_mm = 134.4
height_mm = 84.0

[build_volume]
x = 134.4
y = 84.0
z = 165.0

[output.anycubic]
extension = "pwma"
revision = "v516"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
