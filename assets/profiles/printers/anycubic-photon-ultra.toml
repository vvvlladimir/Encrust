# Anycubic Photon Ultra.

name = "Photon Ultra"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Ultra"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 1280
height_px = 720
width_mm = 102.4
height_mm = 57.6
grey_floor = 0

[build_volume]
x = 102.4
y = 57.6
z = 165.0

[output.anycubic]
extension = "dlp"
revision = "v515"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 1.0

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
