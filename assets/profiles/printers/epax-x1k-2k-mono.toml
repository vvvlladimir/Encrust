# EPAX X1K 2K Mono.
#
# The source profile asks for a `.ctb` below version 4 and we write
# version 4, so this machine needs firmware from 2021 or later. An older
# board refuses the file rather than misprinting it.

name = "X1K 2K Mono"
manufacturer = "EPAX"
machine_name = "EPAX X1K"
mirror_x = true
mirror_y = false
output = "ctb4"
connection = "none"

[display]
width_px = 1620
height_px = 2560
width_mm = 82.62
height_mm = 130.56
grey_floor = 0

[build_volume]
x = 82.62
y = 130.56
z = 155.0

[firmware]
per_layer_settings = false
variable_layer_height = false

[locked]
transition_layers = 0
light_pwm = 255
bottom_light_pwm = 255
