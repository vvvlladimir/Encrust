# Anycubic Photon M3.

name = "Photon M3"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon M3"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 4096
height_px = 2560
width_mm = 163.92
height_mm = 102.4

[build_volume]
x = 163.92
y = 102.4
z = 180.0

[output.anycubic]
extension = "pm3"
revision = "v516"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
