# Phrozen Sonic Mini 8K S.

name = "Sonic Mini 8K S"
manufacturer = "Phrozen"
machine_name = "Phrozen Sonic Mini 8K S"
mirror = "lcd-mirror"
output = "prz"
connection = "none"

[display]
width_px = 7536
height_px = 3240
width_mm = 165.792
height_mm = 71.28

[build_volume]
x = 165.792
y = 71.28
z = 170.0

[firmware]
per_layer_settings = true
variable_layer_height = false

# The firmware runs the light at full power, see ADR 0301.
[locked]
light_pwm = 255
bottom_light_pwm = 255

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
