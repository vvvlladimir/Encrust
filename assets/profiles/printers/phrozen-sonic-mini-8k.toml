# Phrozen Sonic Mini 8K.

name = "Sonic Mini 8K"
manufacturer = "Phrozen"
machine_name = "Phrozen Sonic Mini 8K"
mirror = "lcd-mirror"
output = "ctb-encrypted"

[display]
width_px = 7500
height_px = 3240
width_mm = 165.0
height_mm = 71.28

[build_volume]
x = 165.0
y = 71.28
z = 180.0

# The firmware runs the light at full power, see ADR 0301.
[locked]
light_pwm = 255
bottom_light_pwm = 255

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
