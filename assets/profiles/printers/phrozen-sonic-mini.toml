# Phrozen Sonic Mini.

name = "Sonic Mini"
manufacturer = "Phrozen"
machine_name = "Phrozen Sonic Mini"
mirror = "normal"
front_edge = "min_x"
output = "phz"
connection = "none"

[display]
width_px = 1080
height_px = 1920
width_mm = 68.04
height_mm = 120.96

[build_volume]
x = 68.04
y = 120.96
z = 130.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
light_pwm = 255
bottom_light_pwm = 255

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
