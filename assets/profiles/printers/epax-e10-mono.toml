# EPAX E10 Mono.
#
# The source profile asks for a `.ctb` below version 4 and we write
# version 4, so this machine needs firmware from 2021 or later. An older
# board refuses the file rather than misprinting it.

name = "E10 Mono"
manufacturer = "EPAX"
machine_name = "EPAX E10 4K"
mirror_x = true
mirror_y = false
output = "ctb4"
connection = "none"

[display]
width_px = 3840
height_px = 2400
width_mm = 192.0
height_mm = 120.0
grey_floor = 0

[build_volume]
x = 192.0
y = 120.0
z = 250.0

[firmware]
per_layer_settings = false
variable_layer_height = false
