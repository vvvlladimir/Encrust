# Creality Halot Play.

name = "Halot Play"
manufacturer = "Creality"
machine_name = "HALOT-PLAY"
mirror = "normal"
output = "cxdlp4"
connection = "none"

[display]
width_px = 3840
height_px = 2400
width_mm = 192.0
height_mm = 120.0

[build_volume]
x = 192.0
y = 120.0
z = 200.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
wait_mode = "light-off"
bottom_lift_distance_mm = 8.0
bottom_lift_speed_mm_min = 60.0
bottom_retract_speed_mm_min = 60.0
retract_speed_mm_min = 180.0
light_pwm = 255
bottom_light_pwm = 255
bottom_light_off_delay_s = 0.0

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
exposure_s = { min = 1, max = 10 }
bottom_exposure_s = { min = 10, max = 70 }
bottom_layers = { warn_max = 10 }
lift_distance_mm = { min = 5, max = 15 }
lift_speed_mm_min = { min = 60, max = 180 }
