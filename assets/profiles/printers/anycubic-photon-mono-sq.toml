# Anycubic Photon Mono SQ.

name = "Photon Mono SQ"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon SQ"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 2400
height_px = 2560
width_mm = 120.0
height_mm = 128.0

[build_volume]
x = 120.0
y = 128.0
z = 200.0

[output.anycubic]
extension = "pmsq"
revision = "v515"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
