# Anycubic Photon Mono 2.

name = "Photon Mono 2"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono 2"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 4096
height_px = 2560
width_mm = 143.36
height_mm = 89.1
grey_floor = 0

[build_volume]
x = 143.36
y = 89.1
z = 165.0

[output.anycubic]
extension = "pm3n"
