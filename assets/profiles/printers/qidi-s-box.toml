# QIDI S-Box.
#
# Generated by `cargo xtask gen-profiles`; change the generator, not this file.
#
# UNVERIFIED: these numbers are transcribed from a published machine
# specification, not measured. Check them against the actual machine before
# trusting a print, especially the illuminated area and the mirroring flags.
#
# The source profile asks for a `.ctb` below version 4 and we write
# version 4, so this machine needs firmware from 2021 or later. An older
# board refuses the file rather than misprinting it.

name = "S-Box"
manufacturer = "QIDI"
mirror_x = true
mirror_y = false
output = "ctb4"
connection = "none"

[display]
width_px = 1600
height_px = 2560
width_mm = 135.36
height_mm = 216.576
grey_floor = 0

[build_volume]
x = 135.36
y = 216.576
z = 200.0

[firmware]
per_layer_settings = false
variable_layer_height = false
