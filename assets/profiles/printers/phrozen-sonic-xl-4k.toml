# Phrozen Sonic XL 4K.

name = "Sonic XL 4K"
manufacturer = "Phrozen"
machine_name = "Phrozen Sonic XL 4K"
mirror = "lcd-mirror"
output = "zip"
connection = "none"

[display]
width_px = 3840
height_px = 2400
width_mm = 192.0
height_mm = 120.0

[build_volume]
x = 192.0
y = 120.0
z = 200.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
bottom_light_pwm = 255
light_pwm = 255

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
