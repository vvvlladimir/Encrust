# Anycubic Photon Mono X 6K.

name = "Photon Mono X 6K"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono X 6K"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 5760
height_px = 3600
width_mm = 198.144
height_mm = 123.84
grey_floor = 0

[build_volume]
x = 198.144
y = 123.84
z = 245.0

[output.anycubic]
extension = "pwmb"
revision = "v517"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
