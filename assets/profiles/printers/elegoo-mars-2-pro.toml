# Elegoo Mars 2 Pro.

name = "Mars 2 Pro"
manufacturer = "Elegoo"
machine_name = "ELEGOO Mars 2 Pro"
mirror_x = true
mirror_y = false
front_edge = "min_x"
output = "ctb5"
connection = "none"

[display]
width_px = 1620
height_px = 2560
width_mm = 82.62
height_mm = 130.56
grey_floor = 0

[build_volume]
x = 82.62
y = 130.56
z = 160.0

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
light_pwm = 255
bottom_light_pwm = 255

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }

# Read off the vendor's own slicer profile for this machine; see ADR 0372.
[plate_inset]
min_x_mm = 1.47
max_x_mm = 1.15
min_y_mm = 1.3
max_y_mm = 0.26
