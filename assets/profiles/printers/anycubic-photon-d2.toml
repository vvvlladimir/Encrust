# Anycubic Photon D2.

name = "Photon D2"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon D2"
mirror_x = true
mirror_y = false
connection = "none"

[display]
width_px = 2560
height_px = 1440
width_mm = 130.56
height_mm = 73.44

[build_volume]
x = 130.56
y = 73.44
z = 165.0

[output.anycubic]
extension = "dl2p"
revision = "v517"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
wait_mode = "light-off"
bottom_light_off_delay_s = 0.0

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
