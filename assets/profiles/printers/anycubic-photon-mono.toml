# Anycubic Photon Mono.

name = "Photon Mono"
manufacturer = "Anycubic"
machine_name = "AnyCubic Photon Mono"
mirror_x = true
mirror_y = false
front_edge = "max_x"
connection = "none"

[display]
width_px = 1620
height_px = 2560
width_mm = 82.62
height_mm = 130.56
grey_floor = 0

[build_volume]
x = 82.62
y = 130.56
z = 165.0

[output.anycubic]
extension = "pwmo"
revision = "v515"

[firmware]
per_layer_settings = true
variable_layer_height = false

[locked]
transition_layers = 0
wait_mode = "light-off"
bottom_light_off_delay_s = 0.5

[locked.second_stage]

[limits]
layer_height_mm = { warn_min = 0.01, warn_max = 0.2 }
bottom_layers = { warn_min = 2, warn_max = 10 }
