# Elegoo Saturn 4 Ultra.
#
# UNVERIFIED: these numbers come from published specifications, not from measurement.
# Check them against the actual machine before trusting a print, especially the
# illuminated area and the mirroring flags.

name = "Saturn 4 Ultra"
manufacturer = "Elegoo"
# Verified against a file the vendor's own slicer wrote for this machine.
machine_name = "ELEGOO Saturn 4 Ultra"
mirror_x = true
mirror_y = false
output = "goo"
# Elegoo Link: this generation answers an SDCP broadcast.
connection = "sdcp"

[display]
width_px = 11520
height_px = 5120
width_mm = 218.88
height_mm = 122.88

[build_volume]
x = 218.88
y = 122.88
z = 220.0

[firmware]
# A tilting vat: obeying the per-layer lift and retract stalls the plate, see ADR 0142.
per_layer_settings = false

# The vat tilts to separate a layer, so the peel is the vendor slicer's hidden defaults, and
# it waits by resting only; see ADR 0301 and 0302.
[locked]
wait_mode = "rest"
lift_distance_mm = 0.05
lift_speed_mm_min = 0.05
retract_distance_mm = 0.05
retract_speed_mm_min = 0.05
bottom_lift_distance_mm = 0.05
bottom_lift_speed_mm_min = 0.05
bottom_retract_speed_mm_min = 0.05
