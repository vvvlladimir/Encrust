# Flat parts, plaques and lids: laid for the shortest print and stood on no supports,
# stopped if the check finds an island. The layout is in docs/design/recipes.md.

name = "Flat parts"
format = 1

[[step]]
do = "orient"
set = { goal = "shortest-print" }

[[step]]
do = "check"

[[step]]
do = "gate"
stop_if = "islands > 0"
message = "Islands found; add supports or turn the part"
