# Small detailed models: tilted for the least peel, never hollowed, on the automatic
# supports, and stopped if an island is still hanging after two more tries.
# The layout is in docs/design/recipes.md.

name = "Miniatures"
format = 1

[[step]]
do = "orient"
set = { goal = "least-peel", max_tilt_deg = 45 }

[[step]]
do = "supports"
set = { profile = "auto" }

[[step]]
do = "check"
retry = { while = "islands > 0", max = 2 }

[[step]]
do = "gate"
stop_if = "islands > 0"
message = "Islands still unsupported"
