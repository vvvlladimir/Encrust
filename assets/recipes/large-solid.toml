# Large solid models: repaired if open, hollowed where it saves resin, drained, and stopped
# if resin stays trapped. The layout is in docs/design/recipes.md.

name = "Large solid models"
format = 1

[[step]]
do = "repair"
when = "!sound"

[[step]]
do = "orient"
set = { goal = "auto" }

[[step]]
do = "hollow"
when = "worth_hollowing"
set = { wall_mm = "= clamp(height_mm / 50, 1.5, 3)" }

[[step]]
do = "drain"
set = { at = "auto" }

[[step]]
do = "gate"
stop_if = "trapped > 0"
message = "Resin stays trapped; drill it by hand"

[[step]]
do = "supports"
set = { profile = "auto", cavity = "= hollow" }

[[step]]
do = "check"
