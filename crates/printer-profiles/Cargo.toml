[package]
name = "printer-profiles"
description = "Printer and material profiles loaded from TOML."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[dependencies]
directories.workspace = true
# An own profile's id carries a random tail; see docs/decisions/0261.
getrandom = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# `web-engine` builds for a browser without `encrust-web` above it to pick the source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
