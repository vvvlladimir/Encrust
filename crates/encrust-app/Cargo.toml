[package]
name = "encrust-app"
description = "Desktop GUI for Encrust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[[bin]]
name = "encrust-gui"
path = "src/main.rs"

[dependencies]
core-analysis.workspace = true
core-geometry.workspace = true
core-joint.workspace = true
core-text.workspace = true
core-mesh-io.workspace = true
core-engine.workspace = true
jiff.workspace = true
core-pipeline.workspace = true
core-plate.workspace = true
core-slicer.workspace = true
core-raster.workspace = true
core-supports.workspace = true
core-volume.workspace = true
core-csg.workspace = true
core-format.workspace = true
core-thumbnail.workspace = true
net-prusalink.workspace = true
net-sdcp.workspace = true
printer-link.workspace = true
flate2.workspace = true
ureq.workspace = true
minisign-verify.workspace = true
tar.workspace = true
printer-profiles.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
rayon.workspace = true
web-time.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui-wgpu.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
wgpu.workspace = true
transform-gizmo-egui.workspace = true
meshoptimizer-rs.workspace = true
bytemuck.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# One test writes a `.goo` for the preview to open again; nothing else here names a
# container's crate (ADR 0209).
format-goo.workspace = true
# Pictures of the panels, compared against the ones committed; see docs/decisions/0215.
egui_kittest.workspace = true
# The catalogues read as syntax, so a test can compare their messages and arguments.
fluent-syntax.workspace = true

[features]
# The panel snapshots need a GPU, which no CI runner has, so they run by hand.
snapshots = []

# A browser has no TLS stack to build and no native dialogs; see docs/decisions/0181.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb.workspace = true
ureq = { workspace = true, features = ["rustls"] }
rfd.workspace = true

# The window buttons macOS draws, set on the top bar's centre line; see docs/decisions/0217.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
raw-window-handle.workspace = true

# Asks the Microsoft Store whether it has a newer package for this copy; see docs/decisions/0292.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# A browser names its languages through `navigator.languages`.
sys-locale = { workspace = true, features = ["js"] }
# A browser tells the time and its zone, which a sliced file's name may carry, through JavaScript.
jiff = { workspace = true, features = ["js"] }
web-sys = { workspace = true, features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Storage",
    "StorageManager",
    "Window",
] }

[build-dependencies]
winresource.workspace = true

# What `cargo packager` turns into the installers `release.yml` publishes; see docs/decisions/0160.
[package.metadata.packager]
product-name = "Encrust"
identifier = "app.encrust"
description = "Slicer for MSLA and SLA resin 3D printers"
homepage = "https://github.com/vvvlladimir/Encrust"
publisher = "Encrust contributors"
license-file = "../../LICENSE"
# Beside the binary in every installer: the terms of the libraries compiled into it (ADR 0214).
resources = ["../../THIRD-PARTY-LICENSES.md"]
category = "GraphicsAndDesign"
# The .icns is the squircled macOS grid (ADR 0135); Linux takes the PNG, Windows the .ico.
icons = ["../../assets/icon/encrust.icns", "../../assets/icon/encrust-256.png", "../../assets/icon/encrust.ico"]
binaries = [{ path = "encrust-gui", main = true }, { path = "encrust" }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Merged into the generated Info.plist: why the window asks for the local network (ADR 0262).
info-plist-path = "../../assets/macos/Info.plist"

[package.metadata.packager.nsis]
installer-icon = "../../assets/icon/encrust.ico"
# Per user, so the window's own update can replace the binary without asking for elevation.
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["libgtk-3-0 | libgtk-3-0t64", "libxkbcommon0"]
