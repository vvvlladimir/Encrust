[package]
name = "encrust-app"
description = "Desktop GUI for Encrust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[[bin]]
name = "encrust-gui"
path = "src/main.rs"

[dependencies]
core-analysis.workspace = true
core-geometry.workspace = true
core-mesh-io.workspace = true
core-engine.workspace = true
core-pipeline.workspace = true
core-plate.workspace = true
core-slicer.workspace = true
core-raster.workspace = true
core-supports.workspace = true
core-volume.workspace = true
core-format.workspace = true
core-thumbnail.workspace = true
format-goo.workspace = true
format-chitu.workspace = true
format-anycubic.workspace = true
format-sl1.workspace = true
format-creality.workspace = true
format-svgx.workspace = true
format-cws.workspace = true
net-prusalink.workspace = true
net-sdcp.workspace = true
printer-link.workspace = true
flate2.workspace = true
ureq.workspace = true
minisign-verify.workspace = true
tar.workspace = true
printer-profiles.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
rayon.workspace = true
web-time.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
transform-gizmo-egui.workspace = true
bytemuck.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# A browser has no TLS stack to build and no native dialogs; see docs/decisions/0181.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Storage",
    "StorageManager",
    "Window",
] }

[build-dependencies]
winresource.workspace = true

# What `cargo packager` turns into the installers `release.yml` publishes; see docs/decisions/0160.
[package.metadata.packager]
product-name = "Encrust"
identifier = "app.encrust"
description = "Slicer for MSLA and SLA resin 3D printers"
homepage = "https://github.com/vvvlladimir/Encrust"
publisher = "Encrust contributors"
license-file = "../../LICENSE"
category = "GraphicsAndDesign"
# The .icns is the squircled macOS grid (ADR 0135); Linux takes the PNG, Windows the .ico.
icons = ["../../assets/icon/encrust.icns", "../../assets/icon/encrust-256.png", "../../assets/icon/encrust.ico"]
binaries = [{ path = "encrust-gui", main = true }, { path = "encrust" }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
installer-icon = "../../assets/icon/encrust.ico"
# Per user, so the window's own update can replace the binary without asking for elevation.
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["libgtk-3-0 | libgtk-3-0t64", "libxkbcommon0"]
