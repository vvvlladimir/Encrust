<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Encrust — web prototype</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; }
    label { display: block; margin: 1rem 0; }
    output { display: block; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Encrust in the browser</h1>
  <p>A prototype with no interface: pick a project saved by Encrust, get the sliced file.
    Everything runs on this page; nothing is uploaded.
    <a href="https://github.com/vvvlladimir/Encrust">Source code</a> (AGPL-3.0).</p>
  <label>Memory one cavity may take, MB
    <input id="budget" type="number" value="1024" min="64" step="64"></label>
  <label>Project <input id="project" type="file" accept=".encrust"></label>
  <output id="status"></output>
  <script type="module">
    const status = document.getElementById("status");
    const worker = new Worker("worker.js", { type: "module" });
    worker.onmessage = ({ data }) => {
      if (data.error) {
        status.textContent = `Failed: ${data.error}`;
        return;
      }
      const name = `${data.name}.${data.extension}`;
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([data.bytes]));
      link.download = name;
      link.click();
      status.textContent = `${name}: ${(data.bytes.length / 1e6).toFixed(1)} MB in `
        + `${data.seconds.toFixed(1)} s, wasm memory ${Math.round(data.memory / 1e6)} MB`;
    };
    document.getElementById("project").onchange = async ({ target }) => {
      const file = target.files[0];
      if (!file) return;
      status.textContent = `Slicing ${file.name}…`;
      worker.postMessage({
        name: file.name.replace(/\.encrust$/i, ""),
        bytes: new Uint8Array(await file.arrayBuffer()),
        budget: Number(document.getElementById("budget").value),
      });
    };
  </script>
</body>
</html>
