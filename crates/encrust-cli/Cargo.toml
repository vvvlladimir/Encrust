[package]
name = "encrust-cli"
description = "Command line front end for Encrust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[[bin]]
name = "encrust"
path = "src/main.rs"

# A bench for hollowing: stage timings and peak live bytes, counted by the allocator.
[[bin]]
name = "hollow-lab"
path = "src/bin/hollow_lab.rs"

# A bench for orientation: each goal against poses by hand, on the stack they produce.
[[bin]]
name = "orient-lab"
path = "src/bin/orient_lab/main.rs"

# A bench for automatic supports: what falls, what marks the part, what is more than enough.
[[bin]]
name = "support-lab"
path = "src/bin/support_lab/main.rs"

[dependencies]
core-analysis.workspace = true
core-geometry.workspace = true
core-joint.workspace = true
core-mesh-io.workspace = true
core-engine.workspace = true
jiff.workspace = true
core-pipeline.workspace = true
core-plate.workspace = true
core-slicer.workspace = true
core-raster.workspace = true
core-supports.workspace = true
core-volume.workspace = true
printer-profiles.workspace = true
core-format.workspace = true
core-text.workspace = true
core-thumbnail.workspace = true
net-prusalink.workspace = true
net-sdcp.workspace = true
printer-link.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
clap_complete.workspace = true
indicatif.workspace = true
ctrlc.workspace = true
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# The test reads back a `.goo` it asked for: its checksum and its layer codec.
format-goo.workspace = true
png.workspace = true
