# What `cargo xtask licenses` gathers into THIRD-PARTY-LICENSES.md, which ships in every
# archive and installer. See docs/decisions/0214.
#
# The accepted list is deny.toml's `[licenses] allow` without the workspace's own
# AGPL-3.0-only: a crate under a licence not listed here fails the run rather than reaching
# a user with its terms unstated. The two lists change together.
accepted = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

# Every target a release is built for, so one file covers all of them: the four desktop
# archives and the browser build. A crate pulled in for a platform nobody ships to would
# otherwise state terms that bind nobody.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# A build script's dependency never reaches a user's machine; a test's does not either.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are the AGPL part, covered by LICENSE beside this file.
private = { ignore = true }
# Crates whose licence files cargo-about cannot find in the published package, with the
# terms taken from the SPDX text instead. Kept empty until a release needs an entry, so
# that an unreadable licence is noticed rather than papered over.
workarounds = []
